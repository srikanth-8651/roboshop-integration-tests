
name: Roboshop Integration Tests

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Kubernetes namespace"
        required: true
        type: string
        default: "roboshop-sit"

      catalogue_url:
        description: "Catalogue service URL"
        required: true
        type: string
        default: "http://catalogue.roboshop-sit.svc.cluster.local:8080"

      cart_url:
        description: "Cart service URL"
        required: true
        type: string
        default: "http://cart.roboshop-sit.svc.cluster.local:8080"

      user_url:
        description: "User service URL"
        required: true
        type: string
        default: "http://user.roboshop-sit.svc.cluster.local:8080"

      shipping_url:
        description: "Shipping service URL"
        required: true
        type: string
        default: "http://shipping.roboshop-sit.svc.cluster.local:8080"

      payment_url:
        description: "Payment service URL"
        required: true
        type: string
        default: "http://payment.roboshop-sit.svc.cluster.local:8080"

  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      catalogue_url:
        required: true
        type: string
      cart_url:
        required: true
        type: string
      user_url:
        required: true
        type: string
      shipping_url:
        required: true
        type: string
      payment_url:
        required: true
        type: string

jobs:
  integration-tests:
    runs-on:
      group: roboshop
      labels: nodejs-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Connect to EKS services and run tests
        env:
          NAMESPACE: ${{ inputs.namespace }}
          CATALOGUE_URL: http://127.0.0.1:18080
          CART_URL: http://127.0.0.1:18081
          USER_URL: http://127.0.0.1:18082
          SHIPPING_URL: http://127.0.0.1:18083
          PAYMENT_URL: http://127.0.0.1:18084

        run: |
          set -e

          echo "Starting Kubernetes port-forward connections..."

          kubectl port-forward -n "$NAMESPACE" svc/catalogue 18080:8080 --address 127.0.0.1 > /tmp/catalogue.log 2>&1 &
          kubectl port-forward -n "$NAMESPACE" svc/cart 18081:8080 --address 127.0.0.1 > /tmp/cart.log 2>&1 &
          kubectl port-forward -n "$NAMESPACE" svc/user 18082:8080 --address 127.0.0.1 > /tmp/user.log 2>&1 &
          kubectl port-forward -n "$NAMESPACE" svc/shipping 18083:8080 --address 127.0.0.1 > /tmp/shipping.log 2>&1 &
          kubectl port-forward -n "$NAMESPACE" svc/payment 18084:8080 --address 127.0.0.1 > /tmp/payment.log 2>&1 &

          trap 'kill $(jobs -pr) 2>/dev/null || true' EXIT

          echo "Waiting for services..."

          for port in 18080 18081 18082 18083 18084; do
            ready=false

            for attempt in {1..30}; do
              if (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 1
            done

            if [ "$ready" = false ]; then
              echo "Port-forward failed on port $port"
              cat /tmp/catalogue.log /tmp/cart.log /tmp/user.log /tmp/shipping.log /tmp/payment.log
              exit 1
            fi
          done

          echo "All Kubernetes services are connected!"

          npm test
